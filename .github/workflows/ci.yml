name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:

  # ── Lint Go (golangci-lint) ────────────────────────────────────────────────
  lint-go:
    name: Lint Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [assinatura-go, simulador-go]
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version-file: projetos/${{ matrix.module }}/go.mod
          cache-dependency-path: projetos/${{ matrix.module }}/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
          working-directory: projetos/${{ matrix.module }}

  # ── Go: testes (Windows + Linux) com cobertura ─────────────────────────────
  test-go:
    name: Testes Go ${{ matrix.module }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        module: [assinatura-go, simulador-go]
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version-file: projetos/${{ matrix.module }}/go.mod
          cache-dependency-path: projetos/${{ matrix.module }}/go.sum

      - name: Testes com cobertura
        working-directory: projetos/${{ matrix.module }}
        shell: bash
        run: go test -covermode=atomic -coverprofile=coverage.out ./...

      - name: Resumo de cobertura
        working-directory: projetos/${{ matrix.module }}
        shell: bash
        run: |
          echo "### Cobertura ${{ matrix.module }} (${{ matrix.os }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tail -n 1 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar perfil de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.module }}-${{ matrix.os }}
          path: projetos/${{ matrix.module }}/coverage.out
          retention-days: 7

  # ── Go: verificação de build cross-platform ────────────────────────────────
  build-go:
    name: Build cross-platform (${{ matrix.module }})
    runs-on: ubuntu-latest
    needs: [lint-go, test-go]
    strategy:
      fail-fast: false
      matrix:
        module: [assinatura-go, simulador-go]
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version-file: projetos/${{ matrix.module }}/go.mod
          cache-dependency-path: projetos/${{ matrix.module }}/go.sum

      - name: Compilar para linux, windows e darwin
        working-directory: projetos/${{ matrix.module }}
        run: |
          GOOS=linux   GOARCH=amd64 go build -o /dev/null .
          GOOS=windows GOARCH=amd64 go build -o /dev/null .
          GOOS=darwin  GOARCH=amd64 go build -o /dev/null .

  # ── Java: testes (Windows + Linux) com cobertura JaCoCo ────────────────────
  test-java:
    name: Testes Java (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Executar testes (com cobertura JaCoCo)
        working-directory: projetos/assinador-java
        shell: bash
        run: ./mvnw -B test

      - name: Publicar relatório de cobertura JaCoCo
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: projetos/assinador-java/target/site/jacoco
          retention-days: 7

  # ── Testes de contrato CLI ↔ assinador.jar (subprocess + HTTP reais) ───────
  contract-tests:
    name: Contrato CLI↔JAR (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version-file: projetos/assinatura-go/go.mod
          cache-dependency-path: projetos/assinatura-go/go.sum

      - name: Empacotar assinador.jar
        working-directory: projetos/assinador-java
        shell: bash
        run: ./mvnw -B -q package -DskipTests

      - name: Executar testes de contrato
        working-directory: projetos/assinatura-go
        shell: bash
        env:
          ASSINADOR_JAR: ${{ github.workspace }}/projetos/assinador-java/target/assinador.jar
        run: go test -tags=contract -run Contrato ./internal/invoker/
