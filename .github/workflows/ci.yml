name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:

  # ── Lint Go (golangci-lint) ────────────────────────────────────────────────
  lint-go:
    name: Lint Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [assinatura-go, simulador-go]
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version-file: projetos/${{ matrix.module }}/go.mod
          cache-dependency-path: projetos/${{ matrix.module }}/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
          working-directory: projetos/${{ matrix.module }}

  # ── Go: testes (Windows + Linux) com cobertura ─────────────────────────────
  test-go:
    name: Testes Go ${{ matrix.module }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        module: [assinatura-go, simulador-go]
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version-file: projetos/${{ matrix.module }}/go.mod
          cache-dependency-path: projetos/${{ matrix.module }}/go.sum

      - name: Testes com cobertura
        working-directory: projetos/${{ matrix.module }}
        shell: bash
        run: go test -covermode=atomic -coverprofile=coverage.out ./...

      - name: Resumo de cobertura
        working-directory: projetos/${{ matrix.module }}
        shell: bash
        run: |
          echo "### Cobertura ${{ matrix.module }} (${{ matrix.os }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tail -n 1 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar perfil de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.module }}-${{ matrix.os }}
          path: projetos/${{ matrix.module }}/coverage.out
          retention-days: 7

  # ── Go: verificação de build cross-platform ────────────────────────────────
  build-go:
    name: Build cross-platform (${{ matrix.module }})
    runs-on: ubuntu-latest
    needs: [lint-go, test-go]
    strategy:
      fail-fast: false
      matrix:
        module: [assinatura-go, simulador-go]
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version-file: projetos/${{ matrix.module }}/go.mod
          cache-dependency-path: projetos/${{ matrix.module }}/go.sum

      - name: Compilar para linux, windows e darwin
        working-directory: projetos/${{ matrix.module }}
        run: |
          GOOS=linux   GOARCH=amd64 go build -o /dev/null .
          GOOS=windows GOARCH=amd64 go build -o /dev/null .
          GOOS=darwin  GOARCH=amd64 go build -o /dev/null .

  # ── Java: testes (Windows + Linux) com cobertura JaCoCo ────────────────────
  test-java:
    name: Testes Java (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Executar testes (com cobertura JaCoCo)
        working-directory: projetos/assinador-java
        shell: bash
        run: ./mvnw -B test

      - name: Publicar relatório de cobertura JaCoCo
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: projetos/assinador-java/target/site/jacoco
          retention-days: 7

  # ── Integração PKCS#11 com SoftHSM2 (token real) — ver ADR-0004 ────────────
  pkcs11-integration:
    name: Integração PKCS#11 (SoftHSM2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Instalar SoftHSM2
        run: sudo apt-get update && sudo apt-get install -y softhsm2

      - name: Inicializar token PKCS#11
        run: |
          export SOFTHSM2_CONF="$HOME/softhsm2.conf"
          mkdir -p "$HOME/softhsm-tokens"
          echo "directories.tokendir = $HOME/softhsm-tokens" > "$SOFTHSM2_CONF"
          softhsm2-util --init-token --slot 0 --label runner-test --pin 1234 --so-pin 0000
          MODULE="$(find /usr/lib -name 'libsofthsm2.so' | head -1)"
          echo "Módulo: $MODULE"
          {
            echo "SOFTHSM2_CONF=$SOFTHSM2_CONF"
            echo "PKCS11_MODULE=$MODULE"
            echo "PKCS11_PIN=1234"
          } >> "$GITHUB_ENV"

      - name: Executar testes de integração PKCS#11
        working-directory: projetos/assinador-java
        run: ./mvnw -B test -Dtest=Pkcs11IntegrationTest -DfailIfNoTests=false
